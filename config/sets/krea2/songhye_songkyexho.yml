---
job: "extension"
config:
  name: "krea2_songhye_songkyexho_young_woman" #Songhye Songkyexho
  process:
    - type: "diffusion_trainer"
      training_folder: "/media/justin-wijaya/7d3e3892-cb10-43b8-83b4-a35e3cdf9ab0/justin/Workspace/ai-toolkit/output"
      sqlite_db_path: "./aitk_db.db"
      device: "cuda"
      trigger_word: songkyexho young woman
      performance_log_every: 1000
      network:
        type: "lora"
        linear: 32
        linear_alpha: 32
        network_kwargs:
          ignore_if_contains: []
      save:
        dtype: "bf16"
        save_every: 250
        max_step_saves_to_keep: 12
        save_format: "safetensors"
        push_to_hub: false
      datasets:
        - folder_path: "/media/justin-wijaya/7d3e3892-cb10-43b8-83b4-a35e3cdf9ab0/justin/Workspace/ai-toolkit/datasets/krea2/songhye"
          mask_path: null
          mask_min_value: 0.1
          default_caption: ""
          caption_ext: "txt"
          caption_dropout_rate: 0.00
          cache_latents_to_disk: true
          is_reg: false
          network_weight: 1
          resolution:
            - 768
            - 1024
          controls: []
          flip_x: false
          flip_y: false
          num_repeats: 1
      train:
        batch_size: 1
        steps: 3000
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        timestep_type: "linear"
        content_or_style: "balanced"
        optimizer_params:
          weight_decay: 0.0001
        unload_text_encoder: true
        cache_text_embeddings: true
        lr: 0.0001
        ema_config:
          use_ema: false
          ema_decay: 0.99
        skip_first_sample: true
        force_first_sample: false
        disable_sampling: true
        dtype: "bf16"
        diff_output_preservation: false
        loss_type: "mse"
      logging:
        log_every: 1
        use_ui_logger: true
      model:
        name_or_path: "krea/Krea-2-Raw"
        quantize: true
        qtype: "convrot8"
        quantize_te: true
        qtype_te: "convrot8"
        arch: "krea2"
        low_vram: true
        model_kwargs: {}
        compile: false
        layer_offloading: true
        layer_offloading_text_encoder_percent: 1
        layer_offloading_transformer_percent: 1
      sample:
        sampler: "flowmatch"
        sample_every: 250
        sample_start_step: 0
        width: 896
        height: 1152
        samples:
          - prompt: "[trigger], a gorgeous japanese with fair skin holding a coffee cup, sitting at a cafe, soft morning light"
          - prompt: "[trigger], close-up portrait, looking at the camera, smiling, natural window light"
        neg: ""
        seed: 42
        walk_seed: true
        guidance_scale: 4
        sample_steps: 30
meta:
  name: "[name]"
  version: "1.0"
